# Builds the Windows installer, signs it, and publishes it as a GitHub release
# whenever a version tag like v0.3.0 is pushed. The release carries:
#   - SyncHopper_<version>_x64-setup.exe  the installer for this version
#   - SyncHopper-setup.exe                the same installer under a fixed name,
#                                         so .../releases/latest/download/SyncHopper-setup.exe
#                                         always points at the newest one
#   - SyncHopper_<version>_x64-setup.exe.sig  the update signature
#   - latest.json                         what installed copies check for updates
#
# Test builds: a tag that ends in -test, such as v0.4.90-test, is published
# as a pre-release. Installed copies look for updates at the latest full
# release, so they never see a test build. It is only installed by someone
# who downloads it from its release page. The version in tauri.conf.json is
# the tag without the "v" and the "-test" (0.4.90 here), and must be lower
# than the version of the release it is testing, so that a PC with the test
# build is offered that release when it comes out.
#
# Two kinds of signing happen here:
#   - Code signing with Cover Two's Azure Artifact Signing certificate, so
#     Windows (Smart App Control, SmartScreen) shows Cover Two Strategies LLC
#     as the publisher. It covers the program, the installer, the uninstaller
#     and the Windows 11 right-click entry with its identity package.
#   - The update signature, which installed copies check before updating.
#
# Release builds download the sync engine (rclone) signed by Cover Two from
# the "engine" release, which engine.yml publishes and keeps current. This
# workflow stops early if that isn't published yet.
#
# One-time setup in the repository's Settings:
#   Environments: an environment named "release"
#   Secrets and variables > Actions:
#     secret   TAURI_SIGNING_PRIVATE_KEY           contents of the update key file
#     secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the update key's password
#     variable SYNCHOPPER_UPDATER_PUBKEY           contents of the update key's .pub file
#     variable AZURE_CLIENT_ID                     the app registration's client ID
#     variable AZURE_TENANT_ID                     the Azure tenant (directory) ID
# The app registration signs in without a stored password (a federated
# credential for this repository's "release" environment) and has the
# "Artifact Signing Certificate Profile Signer" role on the signing account.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      SIGN_ENDPOINT: https://eus.codesigning.azure.net/
      SIGN_ACCOUNT: CoverTwoSigning
      SIGN_PROFILE: CoverTwo
      TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The sign tool runs on .NET 10; Microsoft's signing plug-in for
      # SignTool may want .NET 8.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            shell

      - name: Check the tag and the settings
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $test = $tag.EndsWith("-test")
          $plain = if ($test) { $tag.Substring(0, $tag.Length - "-test".Length) } else { $tag }
          if ("v$version" -ne $plain) {
            Write-Error "The tag $tag does not match the app version $version in src-tauri/tauri.conf.json."
            exit 1
          }
          $missing = @()
          if ([string]::IsNullOrWhiteSpace("${{ vars.SYNCHOPPER_UPDATER_PUBKEY }}")) { $missing += "SYNCHOPPER_UPDATER_PUBKEY" }
          if ([string]::IsNullOrWhiteSpace("${{ vars.AZURE_CLIENT_ID }}")) { $missing += "AZURE_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace("${{ vars.AZURE_TENANT_ID }}")) { $missing += "AZURE_TENANT_ID" }
          if ($missing.Count -gt 0) {
            Write-Error "These variables are not set in the repository settings: $($missing -join ', ')"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_BUILD=$(if ($test) { '1' } else { '0' })" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Release builds only download the signed sync engine (engine.yml
      # publishes it), so make sure it is there before releasing.
      - name: Check the signed sync engine is published
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/engine"
          $help = "The signed sync engine isn't published yet. Run the Sync engine workflow first (Actions > Sync engine > Run workflow), then run this one again."
          $check = Join-Path $env:RUNNER_TEMP "engine-check"
          New-Item -ItemType Directory -Force -Path $check | Out-Null
          try {
            Invoke-WebRequest -Uri "$base/engine.json" -OutFile "$check/engine.json"
            Invoke-WebRequest -Uri "$base/engine.json.sig" -OutFile "$check/engine.json.sig"
          } catch {
            Write-Error "$help ($($_.Exception.Message))"
            exit 1
          }
          $list = Get-Content "$check/engine.json" -Raw | ConvertFrom-Json
          $file = $list.files."windows-amd64"
          if (-not $file -or -not $file.name) { Write-Error "The published engine list has no Windows engine. $help"; exit 1 }
          Write-Host "Signed sync engine: rclone $($list.version) ($($file.name))"

      - name: Install build tools
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet tool install --tool-path "$env:RUNNER_TEMP\sign" --prerelease sign
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "SIGN_EXE=$env:RUNNER_TEMP\sign\sign.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write the release build settings
        shell: pwsh
        env:
          PUBKEY: ${{ vars.SYNCHOPPER_UPDATER_PUBKEY }}
        run: |
          $signArgs = @(
            "code", "artifact-signing",
            "--verbosity", "warning",
            "--timestamp-url", $env:TIMESTAMP_URL,
            "--artifact-signing-endpoint", $env:SIGN_ENDPOINT,
            "--artifact-signing-account", $env:SIGN_ACCOUNT,
            "--artifact-signing-certificate-profile", $env:SIGN_PROFILE,
            "--azure-credential-type", "azure-cli",
            "%1"
          )
          $config = @{
            bundle  = @{
              createUpdaterArtifacts = $true
              resources = @{
                "menu-build/synchopper_shell.dll" = "synchopper_shell.dll"
                "menu-build/SyncHopper.msix"      = "SyncHopper.msix"
              }
              windows = @{ signCommand = @{ cmd = $env:SIGN_EXE; args = $signArgs } }
            }
            plugins = @{ updater = @{ pubkey = $env:PUBKEY.Trim() } }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content -Path release.conf.json -Encoding utf8NoBOM
          # The right-click entry's files are made after the program is built,
          # but the build wants them to exist, so start with empty ones.
          New-Item -ItemType Directory -Force -Path src-tauri/menu-build | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/menu-build/synchopper_shell.dll | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/menu-build/SyncHopper.msix | Out-Null

      - name: Build the program
        shell: pwsh
        run: |
          npx tauri build --no-bundle --config release.conf.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the Windows 11 right-click entry
        shell: pwsh
        run: |
          cargo build --release --manifest-path shell/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item shell/target/release/synchopper_shell.dll src-tauri/menu-build/synchopper_shell.dll -Force

      # Signed in just before signing starts: the sign-in is only good for a
      # limited time.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The identity package is signed with SignTool and Microsoft's Artifact
      # Signing plug-in. The sign tool used everywhere else unpacks and repacks
      # packages, which fails for this kind (it points at files outside it).
      - name: Sign the right-click entry and package its identity
        shell: pwsh
        run: |
          az account get-access-token --scope "https://codesigning.azure.net/.default" --output none
          if ($LASTEXITCODE -ne 0) { Write-Error "Could not get permission to sign from Azure."; exit 1 }
          function Sign-File($path) {
            & $env:SIGN_EXE code artifact-signing --verbosity warning --timestamp-url $env:TIMESTAMP_URL `
              --artifact-signing-endpoint $env:SIGN_ENDPOINT --artifact-signing-account $env:SIGN_ACCOUNT `
              --artifact-signing-certificate-profile $env:SIGN_PROFILE --azure-credential-type azure-cli $path
            if ($LASTEXITCODE -ne 0) { Write-Error "Signing $path failed."; exit 1 }
          }
          $dll = Resolve-Path src-tauri/menu-build/synchopper_shell.dll
          Sign-File $dll
          $sig = Get-AuthenticodeSignature $dll
          if ($sig.Status -ne "Valid") { Write-Error "The right-click entry's signature is not valid: $($sig.StatusMessage)"; exit 1 }
          # The identity package must name exactly the certificate it is signed with.
          $publisher = $sig.SignerCertificate.Subject
          Write-Host "Signing certificate: $publisher"
          $stage = Join-Path $env:RUNNER_TEMP "menu"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Copy-Item src-tauri/windows/menu $stage -Recurse
          $manifest = Join-Path $stage "AppxManifest.xml"
          $text = Get-Content $manifest -Raw
          $text = $text.Replace("{{PUBLISHER}}", [System.Security.SecurityElement]::Escape($publisher)).Replace("{{VERSION}}", "$env:VERSION.0")
          Set-Content -Path $manifest -Value $text -Encoding utf8NoBOM
          function Find-SdkTool($name) {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\$name" |
              Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]"0.0" } } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $makeappx = Find-SdkTool "makeappx.exe"
          $signtool = Find-SdkTool "signtool.exe"
          if (-not $makeappx -or -not $signtool) { Write-Error "MakeAppx or SignTool was not found."; exit 1 }
          $msix = Join-Path (Resolve-Path src-tauri/menu-build) "SyncHopper.msix"
          & $makeappx pack /d $stage /p $msix /nv /o
          if ($LASTEXITCODE -ne 0) { Write-Error "Packing the identity package failed."; exit 1 }
          $client = Join-Path $env:RUNNER_TEMP "signing-client"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.151" -OutFile "$client.zip"
          Expand-Archive -Path "$client.zip" -DestinationPath $client -Force
          $dlib = Join-Path $client "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { Write-Error "The Artifact Signing plug-in was not found in the download."; exit 1 }
          $metadata = Join-Path $env:RUNNER_TEMP "signing-metadata.json"
          @{
            Endpoint               = $env:SIGN_ENDPOINT.TrimEnd("/")
            CodeSigningAccountName = $env:SIGN_ACCOUNT
            CertificateProfileName = $env:SIGN_PROFILE
            ExcludeCredentials     = @(
              "ManagedIdentityCredential", "WorkloadIdentityCredential", "SharedTokenCacheCredential",
              "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential",
              "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8NoBOM
          & $signtool sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 /dlib $dlib /dmdf $metadata $msix
          if ($LASTEXITCODE -ne 0) { Write-Error "Signing the identity package failed."; exit 1 }

      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri bundle --config release.conf.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The program inside the installer was signed on the way in; the
          # copy left in the build folder is the unsigned original.
          $setup = "src-tauri/target/release/bundle/nsis/SyncHopper_${env:VERSION}_x64-setup.exe"
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "$setup : $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Error "The installer is not properly signed: $($sig.StatusMessage)"; exit 1 }

      - name: Prepare the release files
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $setup = "SyncHopper_${env:VERSION}_x64-setup.exe"
          if (-not (Test-Path "$dir/$setup")) { Write-Error "Installer $setup was not built."; exit 1 }
          if (-not (Test-Path "$dir/$setup.sig")) { Write-Error "Update signature $setup.sig was not built."; exit 1 }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "$dir/$setup" "release/$setup"
          Copy-Item "$dir/$setup.sig" "release/$setup.sig"
          Copy-Item "$dir/$setup" "release/SyncHopper-setup.exe"
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "SyncHopper $env:VERSION"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$dir/$setup.sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$setup"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path release/latest.json -Encoding utf8NoBOM
          Get-ChildItem release

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem release).FullName --clobber
          } elseif ($env:TEST_BUILD -eq "1") {
            # A pre-release is never the "latest" release, so the update check
            # in installed copies does not see it.
            gh release create $tag (Get-ChildItem release).FullName --title "SyncHopper $env:VERSION (test build)" --notes "A test build. It is not offered to installed copies as an update. To try it, download SyncHopper-setup.exe from this page and run it." --prerelease --latest=false
          } else {
            gh release create $tag (Get-ChildItem release).FullName --title "SyncHopper $env:VERSION" --notes "Download SyncHopper-setup.exe to install. Installed copies update themselves." --latest
          }
